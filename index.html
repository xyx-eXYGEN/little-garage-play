    <title>Little Garage · 故事书</title>
    <!-- little-garage-cache: parent-27 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=parent-27" />
    <style>
      html,
      body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }
        function allowScroll(node) {
          return !!(node && node.closest && node.closest(".allow-scroll, .play-scroll, .topbar, #grownup, .grownup-btn"));
        }
        function pin() {
          if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        }
        document.addEventListener(
          "touchmove",
          function (e) {
            if (e.touches && e.touches.length > 1) {
              e.preventDefault();
              return;
            }
            if (!allowScroll(e.target)) e.preventDefault();
          },
          { passive: false, capture: true }
        );
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
          document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
        });
        window.addEventListener("scroll", pin, { passive: true });
      })();
    </script>
    <div id="app"></div>
    <script src="storybook-data.js?v=parent-27"></script>
    <script src="app.js?v=parent-27"></script>
  </body>
</html>
